<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imora — AI Prompt Library</title>
  <style>
    :root {
      --bg: #0B1120;
      --card-bg: #1E293B;
      --text: #F8FAFC;
      --text-sub: #94A3B8;
      --primary: #0EA5E9;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background-color: var(--card-bg);
      padding: 40px;
      border-radius: 16px;
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .logo {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #38BDF8, #818CF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .desc {
      color: var(--text-sub);
      font-size: 16px;
      margin-bottom: 30px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link-btn {
      display: block;
      background-color: rgba(14, 165, 233, 0.1);
      border: 1px solid var(--primary);
      color: #38BDF8;
      padding: 14px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .link-btn:hover {
      background-color: var(--primary);
      color: #FFF;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Imora</div>
    <div class="desc">Yapay zeka görsel ve metin üretimleri için gelişmiş prompt kütüphanesi.</div>
    <div class="links">
      <a href="privacy-policy.html" class="link-btn">Gizlilik Politikası (Privacy Policy)</a>
      <a href="account-deletion.html" class="link-btn">Hesap ve Veri Silme (Account Deletion)</a>
    </div>
  </div>
</body>
</html>
